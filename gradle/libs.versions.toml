[versions]
agp = "9.0.1"
android-compileSdk = "36"
# 26, not 24: ML Kit GenAI's manifest requires it, and every phone that has
# AICore at all is far newer than either number.
android-minSdk = "26"
android-targetSdk = "36"
androidx-activity = "1.13.0"
androidx-webkit = "1.13.0"
androidx-splashscreen = "1.2.0"
androidx-lifecycle = "2.10.0"
composeMultiplatform = "1.11.0"
haze = "1.7.2"
kotlin = "2.3.21"
kotlinx-coroutines = "1.10.2"
# Not 3.2.x: its ktor-client-core-jvm carries a synthetic name containing
# spaces, which D8 rejects below DEX 040 ("Space characters in SimpleName
# 'use streaming syntax' are not allowed"), so the Android build cannot dex it.
ktor = "3.1.3"
androidx-core = "1.15.0"
androidx-documentfile = "1.0.1"
androidx-media = "1.7.0"
sqlite-jdbc = "3.46.1.3"
ktlint = "1.8.0"
ktlintGradle = "14.2.0"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activity" }
androidx-webkit = { module = "androidx.webkit:webkit", version.ref = "androidx-webkit" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-splashscreen" }
androidx-core = { module = "androidx.core:core", version.ref = "androidx-core" }
androidx-documentfile = { module = "androidx.documentfile:documentfile", version.ref = "androidx-documentfile" }
androidx-media = { module = "androidx.media:media", version.ref = "androidx-media" }
androidx-lifecycle-runtimeCompose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
haze = { module = "dev.chrisbanes.haze:haze", version.ref = "haze" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinx-coroutines" }
# ML Kit GenAI: the client for AICore, which holds the on-device model.
mlkit-genai-summarization = { module = "com.google.mlkit:genai-summarization", version = "1.0.0-beta1" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-js = { module = "io.ktor:ktor-client-js", version.ref = "ktor" }
sqlite-jdbc = { module = "org.xerial:sqlite-jdbc", version.ref = "sqlite-jdbc" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
androidMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "composeMultiplatform" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
ktlint = { id = "org.jlleitschuh.gradle.ktlint", version.ref = "ktlintGradle" }
