name: iosApp
options:
  bundleIdPrefix: dev.mks.duskread
settings:
  base:
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
targets:
  iosApp:
    type: application
    platform: iOS
    sources:
      - iosApp
      # The bundled faces live with the shared UI, not here. Referenced in
      # place so there is one copy of each: Compose loads them through
      # composeResources, and this puts the same files in the app bundle.
      - path: ../composeApp/src/commonMain/composeResources/font
        buildPhase: resources
        type: folder.reference
        optional: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.mks.duskread
        PRODUCT_NAME: DuskRead
        INFOPLIST_FILE: iosApp/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
    preBuildScripts:
      - name: Compile Kotlin Framework
        script: |
          cd "$SRCROOT/.."
          ./gradlew :composeApp:embedAndSignAppleFrameworkForXcode
        inputFiles: []
        outputFiles: []
        basedOnDependencyAnalysis: false
    postBuildScripts:
      # The version lives in gradle/libs.versions.toml, beside Android's. Written
      # into the processed Info.plist before signing, not the source one, so
      # the checked-in plist never drifts from the catalog.
      - name: Stamp Version From Catalog
        script: |
          catalog="$SRCROOT/../gradle/libs.versions.toml"
          version=$(sed -n 's/^app = "\(.*\)"/\1/p' "$catalog")
          build=$(sed -n 's/^appBuild = "\(.*\)"/\1/p' "$catalog")
          if [ -z "$version" ] || [ -z "$build" ]; then
            echo "error: no app / appBuild in $catalog"
            exit 1
          fi
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $version" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $build" "$plist"
        inputFiles:
          - $(SRCROOT)/../gradle/libs.versions.toml
        outputFiles: []
        basedOnDependencyAnalysis: false
