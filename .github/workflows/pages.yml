# Publishes docs/design-system/design-system.html to GitHub Pages.
#
# There is no build step and there is not meant to be one: the page is a
# single self-contained HTML file with no dependencies beyond Google Fonts.
# All this workflow does is assemble a directory with the right filenames in
# it and hand that to Pages.
#
# One manual step before the first run: Settings → Pages → Build and
# deployment → Source → **GitHub Actions**. Without it the deploy job fails
# with "Get Pages site failed".
name: Deploy design system page

on:
    push:
        branches: [main]
        # Nothing else in the repo affects the page, and a Kotlin change should
        # not spend a deploy.
        paths:
            - 'docs/design-system/**'
            - '.github/workflows/pages.yml'
    workflow_dispatch:

permissions:
    contents: read
    pages: write
    id-token: write

# Let a run in flight finish rather than cancelling it — a half-deployed
# Pages site is worse than a slightly stale one.
concurrency:
    group: pages
    cancel-in-progress: false

jobs:
    build:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v5

            - name: Assemble the site
              run: |
                  set -euo pipefail
                  mkdir -p _site

                  # The page is the site root, so it has to be index.html.
                  cp docs/design-system/design-system.html _site/index.html

                  # Jekyll would try to process this directory and has nothing to
                  # add; .nojekyll also stops it swallowing any file starting with
                  # an underscore.
                  touch _site/.nojekyll

                  # design-tokens.md is a GitHub-rendered document, not a page: served
                  # from Pages as text/markdown it would download rather than render.
                  # The link stays relative in the repo (so it works from a local
                  # checkout) and is rewritten to the blob URL only for the deploy.
                  BLOB="https://github.com/${GITHUB_REPOSITORY}/blob/main/docs/design-system/design-tokens.md"
                  sed -i "s|href=\"design-tokens.md\"|href=\"${BLOB}\"|g" _site/index.html

                  # Fail loudly rather than shipping a page with a dead link in it.
                  if grep -q 'href="design-tokens.md"' _site/index.html; then
                    echo "::error::relative design-tokens.md link survived the rewrite"
                    exit 1
                  fi

                  ls -la _site

            - uses: actions/upload-pages-artifact@v5
              with:
                  path: _site
                  include-hidden-files: true

    deploy:
        needs: build
        runs-on: ubuntu-latest
        environment:
            name: github-pages
            url: ${{ steps.deployment.outputs.page_url }}
        steps:
            - id: deployment
              uses: actions/deploy-pages@v5
